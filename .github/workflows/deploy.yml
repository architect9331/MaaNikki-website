name: Deploy website

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read content revision
        id: upstream
        run: echo "revision=$(node -p 'require("./upstream.json").commit')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: architect9331/MaaNikki
          ref: ${{ steps.upstream.outputs.revision }}
          path: .upstream
          sparse-checkout: |
            docs/manual.md
            docs/images
            resource/icon.png
            resource/data/blessing_catalog.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build homepage and user manual
        run: npm run build
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
